[meta]
name               = "K2-Horizon MoVA 36B A4B 4bit"
released           = "2026-09"
status             = "untested"
spec_source        = "config.json"
notes              = "New candidate (reports/2026-10-09-new-candidates/plan.md). MoE, 36B total, 4B active, 512k native context. The card reports Terminal-Bench 2.1 58.6 against 44.9 for Qwen3.6-35B-A3B. 26.4 GB on disk, the same tier as optiq; same 12 GiB cache and 64k context. mlx-lm 0.31.3 has no k2_horizon class: the repo ships k2_horizon.py, loaded through config.json model_file, so the server runs with trust_remote_code. reasoning_effort low keeps it closest to optiq's non-thinking mode. Bench-only."
model_vram_gb      = 27
gpu_wired_limit_gb = 48
machine_min_ram_gb = 64

[params]
MLX_MODEL                  = "mlx-community/K2-Horizon-MoVA-36B-A4B-4bit"
MLX_SERVER_TYPE            = "mlx-lm"
MLX_TRUST_REMOTE_CODE      = "1"
MLX_CACHE_SIZE             = "3"
MLX_CACHE_BYTES            = "12884901888"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "65536"
MLX_OPENCODE_OUTPUT        = "16384"
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"
MLX_CHAT_TEMPLATE_ARGS     = '{"reasoning_effort": "low", "tool_call_format": "json"}'
MLX_TOP_P                  = "0.95"
MLX_NAV_PILOT_TEMPERATURE  = "0.6"
MLX_NAV_PILOT_TOP_P        = "0.95"

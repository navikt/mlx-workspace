[meta]
name               = "Qwen 3.6 27B 4bit"
released           = "2026-06"
status             = "untested"
spec_source        = "config.json"
notes              = "Dense sibling of the MoE we chose for the alpha. Same generation, same tokenizer family, 16.1 GB against 18.6 GB. It puts a number on the dense-versus-sparse gap inside one model family, which so far we have only inferred across families."
model_vram_gb      = 16
gpu_wired_limit_gb = 36

[params]
MLX_MODEL                  = "mlx-community/Qwen3.6-27B-4bit"
MLX_SERVER_TYPE            = "mlx-lm"
MLX_CACHE_SIZE             = "3"
MLX_CACHE_BYTES            = "12884901888"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "65536"
MLX_OPENCODE_OUTPUT        = "16384"
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"
MLX_CHAT_TEMPLATE_ARGS     = '{"enable_thinking": false}'
MLX_TOP_K                  = "20"
MLX_TOP_P                  = "0.95"
MLX_MIN_P                  = "0.0"

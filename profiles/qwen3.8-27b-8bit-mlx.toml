[meta]
name               = "Qwen 3.8 27B 8bit (mlx-lm)"
released           = "2026-07"
status             = "untested"
spec_source        = "config.json"
notes              = "The quality champion at a size that may fit the 48 GB target after all. 29.5 GB of weights, where a colleague reports a llama.cpp Q6 of the same model running in 28-30 GB total on an M4 Pro 48 GB. We assumed 8-bit was out of reach for that machine; this profile tests the assumption. Context is set to the same 65k the other team runs, because at this weight size the KV cache is what decides whether it fits."
model_vram_gb      = 30
gpu_wired_limit_gb = 36

[params]
MLX_MODEL                  = "mlx-community/Qwen3.8-27B-8bit"
MLX_SERVER_TYPE            = "mlx-lm"
# 4 GB of prompt cache, not the 12 GB the smaller profiles use. At 29.5 GB of
# weights that is what is left under a 36 GB wired limit.
MLX_CACHE_BYTES            = "4294967296"
MLX_CACHE_SIZE             = "2"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "65536"
MLX_OPENCODE_OUTPUT        = "16384"
MLX_OPENCODE_CHUNK_TIMEOUT = "900000"
MLX_CHAT_TEMPLATE_ARGS     = '{"enable_thinking": false}'
MLX_TOP_K                  = "20"
MLX_TOP_P                  = "0.95"
MLX_MIN_P                  = "0.0"

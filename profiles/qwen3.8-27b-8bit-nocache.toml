[meta]
name               = "Qwen 3.8 27B oQ8e MTP (oMLX)"
released           = "2026-07"
status             = "testing"
spec_source        = "local"
notes              = "Official Qwen/Qwen3.8-27B, 8-bit oQ quant by the oMLX author with the MTP head embedded (language_model.mtp.*), so oMLX runs Lightning MTP on it. Replaces the abliterated mvid/Huihui MTPLX build; not yet measured. Needs mtp_enabled for Jundot--Qwen3.8-27B-oQ8e-mtp in ~/.omlx/model_settings.json."
model_vram_gb      = 30
gpu_wired_limit_gb = 96

[params]
MLX_MODEL                  = "Jundot/Qwen3.8-27B-oQ8e-mtp"
MLX_SERVER_TYPE            = "omlx"
MLX_OMLX_HOT_CACHE_MAX_SIZE = "0"
MLX_OMLX_SSD_CACHE_MAX_SIZE = "0"
MLX_CACHE_BYTES            = "21474836480"  # required by the schema; oMLX ignores it (hot/SSD cache sizes above apply)
MLX_CACHE_SIZE             = "5"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "131072"
MLX_OPENCODE_OUTPUT        = "16384"  # thinking model: 4096 truncated mid-<think> (finish_reason=length)
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"

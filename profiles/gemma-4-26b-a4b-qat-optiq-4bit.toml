[meta]
name               = "Gemma 4 26B A4B QAT OptiQ 4bit"
released           = "2026-09"
status             = "untested"
spec_source        = "config.json"
notes              = "New candidate (reports/2026-10-11-newmodels/plan.md). Google, Apache-2.0, QAT weights under OptiQ, 21.9 GB. Served by mlx-lm (gemma4 model class and tool parser), not mlx-vlm like profiles/gemma-4-26b-a4b.toml. vllm-mlx reports drift to Python-style calls in long multi-tool prompts (issue #80); the standard set shows whether that hits OpenCode. Bench-only."
model_vram_gb      = 22
gpu_wired_limit_gb = 48
machine_min_ram_gb = 64

[params]
MLX_MODEL                  = "mlx-community/gemma-4-26B-A4B-it-qat-OptiQ-4bit"
MLX_SERVER_TYPE            = "mlx-lm"
MLX_CACHE_SIZE             = "3"
MLX_CACHE_BYTES            = "12884901888"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "65536"
MLX_OPENCODE_OUTPUT        = "16384"
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"
MLX_TOP_P                  = "0.95"
MLX_NAV_PILOT_TEMPERATURE  = "0.6"
MLX_NAV_PILOT_TOP_P        = "0.95"

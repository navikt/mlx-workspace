[meta]
name               = "Qwen 3.6 35B A3B OptiQ 4bit"
released           = "2026-06"
status             = "untested"
spec_source        = "config.json"
notes              = "The alpha model's weights under OptiQ quantization, 24.7 GB against 18.6 GB. Quantization is the only variable, the same shape as the DWQ comparison that rejected DWQ on 2 of 7 verified against 5 of 7. Worth one run because quantization is the cheapest lever that has ever moved these numbers, and the most recent one to disappoint."
model_vram_gb      = 25
gpu_wired_limit_gb = 36

[params]
MLX_MODEL                  = "mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit"
MLX_SERVER_TYPE            = "mlx-lm"
MLX_CACHE_SIZE             = "3"
MLX_CACHE_BYTES            = "12884901888"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "65536"
MLX_OPENCODE_OUTPUT        = "16384"
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"
MLX_CHAT_TEMPLATE_ARGS     = '{"enable_thinking": false}'
MLX_TOP_K                  = "20"
MLX_TOP_P                  = "0.95"
MLX_MIN_P                  = "0.0"

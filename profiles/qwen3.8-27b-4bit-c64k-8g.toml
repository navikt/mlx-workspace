[meta]
name               = "Qwen 3.8 27B 4bit, 64k kontekst, 8 GiB cache, uten pin"
released           = "2026-07"
status             = "testing"
spec_source        = "externally verified"
notes              = "Tuning point for the 36 GB tier (reports/2026-09-23-local-model-evaluation/qwen38-tuning.md). qwen3.8-27b-4bit with context 65,536, output 8,192, an 8 GiB prompt cache (was 12 GiB) and no reasoning_effort pin. 8 GiB holds one full-window session (73.7k tokens x 64 KiB = 4.5 GiB) plus a shorter one, and leaves the same headroom the OptiQ build needs for its 2.5 GB of extra weights, so the two compare like for like."
model_vram_gb      = 16
gpu_wired_limit_gb = 36

[params]
MLX_MODEL                  = "mlx-community/Qwen3.8-27B-4bit"
MLX_SERVER_TYPE            = "mlx-lm"
MLX_CACHE_BYTES            = "8589934592"
MLX_CACHE_SIZE             = "3"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "65536"
MLX_OPENCODE_OUTPUT        = "8192"
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"
MLX_CHAT_TEMPLATE_ARGS     = '{"enable_thinking": false}'
MLX_TOP_K                  = "20"
MLX_TOP_P                  = "0.95"
MLX_MIN_P                  = "0.0"

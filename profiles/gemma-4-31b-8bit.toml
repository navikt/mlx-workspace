[meta]
name               = "Gemma 4 (31B) 8bit"
released           = "2026-06"
status             = "testing"
spec_source        = "local"
notes              = "Google's 2026 edge-optimized flagship. Great for high-precision local chat."
model_vram_gb      = 31
gpu_wired_limit_gb = 96

[params]
MLX_MODEL                  = "mlx-community/gemma-4-31b-it-8bit"
MLX_SERVER_TYPE            = "mlx-lm"  # model_type=gemma4 → mlx_lm/models/gemma4.py (text path); only gemma4_unified needs mlx-vlm
MLX_CACHE_BYTES            = "21474836480"  # 20GB cache
MLX_CACHE_SIZE             = "5"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "131072"
MLX_OPENCODE_OUTPUT        = "16384"  # parity with qwen3.8 / deepseek runs
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"

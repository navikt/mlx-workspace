[meta]
name               = "Qwen 3.6 35B A3B 8bit, 64 GB tier, 52 GB wired, 12 GiB cache"
released           = "2026-04"
status             = "testing"
spec_source        = "config.json"
notes              = "64 GB tier, shortlist #2 at the plan's profile (reports/2026-09-26-64gb-tier/plan.md §3): 38 / 52 / 64 / 64k + 16k with optiq's 12 GiB cache, estimated peak about 47 GB (37.7 + 9.6). The retry for qwen3.6-35b-a3b-8bit-64g; needs mise run vram-set 52. Bench-only."
model_vram_gb      = 38
gpu_wired_limit_gb = 52
machine_min_ram_gb = 64


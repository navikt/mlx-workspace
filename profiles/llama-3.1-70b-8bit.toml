MLX_CACHE_SIZE             = "3"
MLX_MAX_TOKENS             = "8192"
MLX_OPENCODE_CONTEXT       = "131072"
MLX_OPENCODE_OUTPUT        = "4096"
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"

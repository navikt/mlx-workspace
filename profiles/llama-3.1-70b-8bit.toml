[meta]
name               = "Llama 3.1 70B Instruct 8bit"
released           = "2024-07"
status             = "testing"
spec_source        = "local"
notes              = "Solid mid-range standard. Same footprint as Qwen 72B, leaves 40GB+ for massive context."
model_vram_gb      = 70
gpu_wired_limit_gb = 115

[params]
MLX_MODEL                  = "mlx-community/Meta-Llama-3.1-70B-Instruct-8bit"

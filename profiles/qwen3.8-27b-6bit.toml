[meta]
name               = "Qwen 3.8 27B 6bit"
released           = "2026-07"
status             = "not a stand-in for the llama.cpp build"
spec_source        = "externally verified"
notes              = "Written to reproduce another Nav team's configuration, and it does not. They run llama.cpp with an Unsloth GGUF Q6_K_XL on an M4 Pro 48 GB at about 10 tok/s. This is mlx-lm with an MLX 6-bit conversion on an M5 Max, and it is pathologically slow: R2, which the 4-bit build of the same weights answers in 30 seconds and Qwen3.6-35B-A3B in 4.6 seconds, took 1546.8 seconds here, and R1 timed out at a 1800 second cap. Prefill measured normal at about 285 tok/s on a fresh server, so the cause is unexplained. Keep this profile as the record of an MLX 6-bit result, do not read it as a result about Q6 quantization or about the other team's setup."
model_vram_gb      = 22
gpu_wired_limit_gb = 36

[params]
MLX_MODEL                  = "lmstudio-community/Qwen3.8-27B-MLX-6bit"
MLX_SERVER_TYPE            = "mlx-lm"
MLX_CACHE_BYTES            = "12884901888"
MLX_CACHE_SIZE             = "3"
MLX_MAX_TOKENS             = "32768"
# 57k input plus 8k output, the split the other team runs. Lower than the 4-bit
# profile's 131k on purpose: their point is that the context budget is much smaller
# than the cloud Copilot models, and instructions have to be trimmed to fit.
MLX_OPENCODE_CONTEXT       = "65536"
MLX_OPENCODE_OUTPUT        = "8192"
MLX_OPENCODE_CHUNK_TIMEOUT = "900000"
# Thinking left ON, unlike the 4-bit profile. The other team runs medium reasoning
# and accepts the wall clock because the work runs in the background. Our own
# measurement puts thinking at about 2.3x on routine operations, so expect that.
MLX_TOP_K                  = "20"
MLX_TOP_P                  = "0.95"
MLX_MIN_P                  = "0.0"

[meta]
name               = "Qwen 3.6 35B A3B 8bit, 64 GB machines, 48 GB wired"
released           = "2026-04"
status             = "testing"
spec_source        = "config.json"
notes              = "Proposed 64 GB entry (reports/2026-09-26-64gb-tier/night-64-5.md, Review): qwen3.6-35b-a3b-8bit-64g as measured on nights 64-1 to 64-5, 64k context and a 16k reply at 48 GB wired. Its 49k-token probe peaked at 46.18 GB, 0.18 GB over the plan's 46 GB line, and sessions at 45.11 GB. Prompts past 49k are unmeasured and extrapolate to about 50 GB, over the limit."
model_vram_gb      = 38
gpu_wired_limit_gb = 48
machine_min_ram_gb = 64


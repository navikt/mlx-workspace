[meta]
name               = "Qwen 3.6 35B A3B OptiQ 4bit, temp 0 (greedy)"
released           = "2026-06"
status             = "testing"
spec_source        = "config.json"
notes              = "Temperature control for the 2026-09-24 night run: identical to qwen3.6-35b-a3b-optiq except MLX_TEMP = 0.0. The workspace server defaults MLX_TEMP to 0.6 (.mise/tasks/server), so every cheap-ops score so far was measured at 0.6, while nav-pilot users run greedy: nav-pilot sets no temperature, opencode sends none (mlx-lm's own default is 0.0) and Copilot CLI sends 0. This profile measures the production setting. top_p/top_k stay as in the base but have no effect at temp 0. Compare with the 2026-09-23 runs of qwen3.6-35b-a3b-optiq at 0.6 (reports/2026-09-23-local-model-evaluation/night-2026-09-24.md)."
model_vram_gb      = 25
gpu_wired_limit_gb = 36

[params]
MLX_MODEL                  = "mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit"
MLX_SERVER_TYPE            = "mlx-lm"
MLX_CACHE_SIZE             = "3"
MLX_CACHE_BYTES            = "12884901888"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "65536"
MLX_OPENCODE_OUTPUT        = "16384"
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"
MLX_CHAT_TEMPLATE_ARGS     = '{"enable_thinking": false}'
MLX_TOP_K                  = "20"
MLX_TOP_P                  = "0.95"
MLX_MIN_P                  = "0.0"
# Greedy, as nav-pilot runs it in production. The only difference from qwen3.6-35b-a3b-optiq.
MLX_TEMP                   = "0.0"

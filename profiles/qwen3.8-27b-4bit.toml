[meta]
name               = "Qwen 3.8 27B 4bit"
released           = "2026-07"
status             = "testing"
spec_source        = "externally verified"
notes              = "Target-hardware build for a 48 GB Pro Mac. 16 GB weights at 4-bit, halving the per-token memory traffic of the 8-bit — which binds before capacity does on Pro-class bandwidth. No speculative decoding: the MTP head is oMLX-only, so expect the 11-14 tok/s non-MTP baseline, not the 8-bit MTPLX 18-38. Context is capped at 64k, not 131k: the 8-bit build died with a Metal OOM at about 51k prompt tokens under the 36 GB wired limit on 2026-09-23 (no fused attention kernel for head_dim 256), and the same attention cost puts this build over the line above about 85k with a warm prompt cache. Output 8k and an 8 GiB prompt cache per qwen38-tuning.md §7, confirmed on 2026-09-24 by the qwen3.8-27b-4bit-c64k-8g point: 37.21 GB peak through a 54.6k-token prompt, cold TTFT 50.9 s at 30k and 106.7 s at 57k, warm 0.49 s, 25.2 tok/s at 30k, 10 of 11 launched Copilot sessions verified (bench/np-e2e-qwen3.8-27b-4bit-c64k-8g-20260924-174139.json). Kept for benchmarking: the manifest's 4-bit slot moved to qwen3.8-27b-optiq-4bit on 2026-09-24, which beat this build on cheap-ops (18/30 against 11/20) with 0 timeouts against 4."
model_vram_gb      = 16
gpu_wired_limit_gb = 36

[params]
MLX_MODEL                  = "mlx-community/Qwen3.8-27B-4bit"
# NO draft model: the MTP head is model_type `qwen3_5_mtp`, which mlx-lm cannot load
# ("Model type qwen3_5_mtp not supported"). MTP is an oMLX feature — the 8-bit MTPLX build
# runs it because oMLX absorbs mtp.safetensors into its own index. A drafter for mlx-lm would
# have to be an ordinary small qwen3_5 model, not this head.
MLX_SERVER_TYPE            = "mlx-lm"
# 8 GiB: one full-window session (73.7k tokens x 64 KiB = 4.5 GiB) plus a shorter one.
# 12 GiB measured 39.0 GB peak at 60k; 8 GiB measured 37.21 GB through 54.6k (2026-09-24).
MLX_CACHE_BYTES            = "8589934592"
MLX_CACHE_SIZE             = "3"
MLX_MAX_TOKENS             = "32768"
MLX_OPENCODE_CONTEXT       = "65536"
MLX_OPENCODE_OUTPUT        = "8192"
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"
# Qwen model card sampling. Both weather-cli runs were measured with top_k disabled and
# top_p at 1.0, which is not what the card specifies. Running with top_k off produced a
# degenerate repetition loop on Qwen3.5-9B, so this is a correction, not a preference.
# Thinking disabled for routine operations. With it enabled this model ran 6.7x slower than
# the Qwen3.6 MoE on the cheap-operations benchmark and produced 1.87x the output tokens for
# the same work. Analysis attributes most of the gap to dense-vs-sparse decode throughput
# (4.7 vs 22.4 tok/s) rather than to thinking, so this is expected to recover part of the gap,
# not all of it. Published work on Qwen3 1.7B-32B finds thinking helps planning constraints and
# hurts precision ones, which is most of that task set.
# No reasoning_effort pin. The pin was added hours before both 1 September runs of
# the pinned 8-bit verified nothing and is absent from every earlier run; the tuning
# profiles (reports/2026-09-23-local-model-evaluation/qwen38-tuning.md §7) drop it.
MLX_CHAT_TEMPLATE_ARGS     = '{"enable_thinking": false}'
MLX_TOP_K                  = "20"
MLX_TOP_P                  = "0.95"
MLX_MIN_P                  = "0.0"
# By analogy with the 8-bit, not measured on this build: the 8-bit scored 31/40 at 0.6
# against 12/20 at temperature 0 (2026-09-24), and the optiq default 28/40 against 17/30.
# Copilot CLI sends temperature 0, so nav-pilot's guard sets both.
MLX_NAV_PILOT_TEMPERATURE  = "0.6"
MLX_NAV_PILOT_TOP_P        = "0.95"

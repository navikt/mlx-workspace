[meta]
name               = "DeepSeek V4 Flash (284B MoE) 3bit"
released           = "2026-05"
status             = "recommended"
spec_source        = "local"
notes              = "284B MoE, ~13B active. 10m 09s / 17-17 on weather-cli at 19.1 tok/s. Acts rather than deliberates: 30 small turns, plans to a file, delegates to sub-agents. Costs 79 GB resident for the same wall clock as qwen3.8-27b."
model_vram_gb      = 105
gpu_wired_limit_gb = 115

[params]
MLX_MODEL                  = "mlx-community/DeepSeek-V4-Flash-0731-2.4bit-mixed"
MLX_CACHE_BYTES            = "17179869184"  # 16GB cache
MLX_CACHE_SIZE             = "3"
MLX_MAX_TOKENS             = "32768"
MLX_SERVER_TYPE            = "omlx"
MLX_CHAT_TEMPLATE          = "chat_templates/deepseek-v4-flash.jinja"
MLX_OPENCODE_CONTEXT       = "131072"
MLX_OPENCODE_OUTPUT        = "16384"  # parity with qwen3.8 run
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"

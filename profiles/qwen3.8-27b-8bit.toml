[meta]
name               = "Qwen 3.8 27B Instruct 8bit"
released           = "2026-07"
status             = "recommended"
spec_source        = "local"
notes              = "Astoundingly fast and highly agentic. Flawless JSON tool-calling and response times under 10 seconds. Leaves ~100GB of RAM free."
model_vram_gb      = 27
gpu_wired_limit_gb = 96

[params]
MLX_MODEL                  = "mlx-community/Qwen3.8-27B-8bit"
MLX_CACHE_BYTES            = "21474836480"  # 20GB cache
MLX_CACHE_SIZE             = "5"
MLX_MAX_TOKENS             = "8192"
MLX_CHAT_TEMPLATE          = "{{config_root}}/qwen_template.jinja"
MLX_OPENCODE_CONTEXT       = "131072"
MLX_OPENCODE_OUTPUT        = "4096"
MLX_OPENCODE_CHUNK_TIMEOUT = "600000"

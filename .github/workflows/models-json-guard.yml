name: models.json guard

# manifest/models.json is fetched by released nav-pilot straight from this
# repo's main branch (see BENCHMARKING.md, "models.json is a release, not a
# data file"). A PR that changes it must spell out the user impact so a
# reviewer can judge it like a release, not a config tweak.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  require-user-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require "## User impact" section when manifest/models.json changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'manifest/models.json'; then
            echo "manifest/models.json unchanged, nothing to check."
            exit 0
          fi
          if ! grep -q '^## User impact' <<< "$PR_BODY"; then
            echo "::error::manifest/models.json changed but the PR body has no '## User impact' section. State which verdicts or fields change and whether nav-pilot reads them (see BENCHMARKING.md)."
            exit 1
          fi
          echo "PR body has a User impact section."
